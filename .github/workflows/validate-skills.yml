name: Validate Skills

# PR-time guard rails. Runs on every push / PR that touches a skill, the
# release scripts, or any localized README. Cheap, fast, no side effects.

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/release/**"
      - "README.md"
      - "README.zh-CN.md"
      - "README.ja-JP.md"
      - ".github/workflows/validate-skills.yml"
      - "package.json"
  push:
    branches: ["main"]
    paths:
      - "skills/**"
      - "scripts/release/**"
      - "README.md"
      - "README.zh-CN.md"
      - "README.ja-JP.md"
      - ".github/workflows/validate-skills.yml"
      - "package.json"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # This reference fork validates a checked-in upstream release snapshot.
      # Fork tags and GITHUB_REPOSITORY do not define upstream downloads.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate manifests, smoke-pack, and verify README sync
        run: npm run validate
